name: Eventbrite sync

# Cloud ticket-truth automation (JD, 2026-06-10).
# Pulls live prices, tier states and ticket counts from Eventbrite,
# recomputes badge labels and group pricing, and commits the updated
# events-boombastic.json. The commit triggers Netlify to rebuild and deploy, which
# regenerates hubs, sitemap and per-event shells from the fresh data.
# Runs 04:00, 10:00 and 16:00 UTC so counts stay honest through the
# evening booking window. No Mac involved anywhere in the loop.

on:
  schedule:
    - cron: '0 4 * * *'
    - cron: '0 10 * * *'
    - cron: '0 16 * * *'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: eventbrite-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Sync prices and availability from Eventbrite
        env:
          EVENTBRITE_TOKEN: ${{ secrets.EVENTBRITE_TOKEN }}
        run: node scripts/sync-eventbrite-prices.js

      - name: Open sync pull request if changed
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          target="public/events-boombastic.json"
          changed="$(git diff --name-only)"
          if [ -z "$changed" ]; then
            echo "No changes."
            exit 0
          fi
          if [ "$changed" != "$target" ]; then
            printf 'Unexpected changed paths:\n%s\n' "$changed" >&2
            exit 1
          fi
          git config user.name "eventbrite-sync[bot]"
          git config user.email "hello@boomevents.co.uk"
          branch="automation/eventbrite-sync-${GITHUB_RUN_ID}"
          git switch -c "$branch"
          git add "$target"
          git commit -m "chore: sync Eventbrite prices and availability [automated]"
          git push --set-upstream origin "$branch"
          gh pr create \
            --base main \
            --head "$branch" \
            --title "chore: sync Eventbrite prices and availability" \
            --body "Automated Eventbrite ticket-truth update. Review and merge through the normal main-branch gate."
