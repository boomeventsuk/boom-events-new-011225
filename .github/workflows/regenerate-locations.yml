name: Regenerate Location Pages

# Runs daily at 04:15 UTC, plus on any push that changes the events JSON or
# location config. Regenerates static location HTML from events-boombastic.json,
# commits + pushes if anything changed. Netlify auto-deploys on push.

on:
  schedule:
    - cron: '15 4 * * *'
  workflow_dispatch:
  push:
    paths:
      - 'public/events-boombastic.json'
      - 'scripts/location-config.json'
      - 'scripts/generate-location-pages.cjs'

permissions:
  contents: write

jobs:
  regenerate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Sanitise events JSON (no em dashes)
        run: node scripts/sanitise-events-json.js

      - name: Regenerate location pages
        run: node scripts/generate-location-pages.cjs

      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/events-boombastic.json public/locations/
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "auto: regenerate location pages [$(date -u +%Y-%m-%d)]"
            git push
          fi
